[package]
name = "fuzzforge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wasmi = "2.0.0-beta.2"

[dev-dependencies]
tempfile = "3.23"
tiny_http = "0.12"
wat = "1.240"
